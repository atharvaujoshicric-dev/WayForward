<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SKYLUXE — Media Plan &amp; Deck Studio</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
  :root{
    --navy:#0f172a; --navy-2:#131f3b; --slate:#1e293b; --slate-2:#334155;
    --gold:#d97706; --amber:#f59e0b; --ivory:#f8fafc; --paper:#ffffff;
    --line:#e2e8f0; --muted:#64748b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--ivory); color:var(--navy); font-family:'Inter',sans-serif; }
  #root{ min-height:100vh; }
  .font-display{ font-family:'Playfair Display', serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:#94a3b8; }

  .ruler{
    height:6px;
    background-image: repeating-linear-gradient(90deg, var(--gold) 0 2px, transparent 2px 10px);
    background-position: left center;
    opacity:.85;
  }
  .ruler-vert{
    width:6px;
    background-image: repeating-linear-gradient(180deg, var(--gold) 0 2px, transparent 2px 10px);
  }
  .glass{
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .blueprint-bg{
    background-image:
      linear-gradient(rgba(217,119,6,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,119,6,0.08) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .stat-badge{
    background:linear-gradient(135deg,#fffdf7,#fff);
    border:1px solid #f1e3c8;
  }
  .tab-btn{ transition: all .18s ease; }
  .num-input{
    font-family:'JetBrains Mono', monospace;
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    width:100%;
    color:var(--navy);
  }
  .num-input:focus{ outline:2px solid var(--gold); outline-offset:1px; background:#fff; }
  .text-input{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    width:100%;
    color:var(--navy);
  }
  .text-input:focus{ outline:2px solid var(--gold); outline-offset:1px; background:#fff; }
  table.data-table{ border-collapse:collapse; width:100%; font-size:13px; }
  table.data-table th{
    background:var(--navy); color:#fff; text-align:left; padding:8px 10px;
    font-weight:600; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
  }
  table.data-table td{ padding:7px 10px; border-bottom:1px solid var(--line); font-family:'JetBrains Mono',monospace; }
  table.data-table tr:nth-child(even) td{ background:#f8fafc; }
  table.data-table tr:hover td{ background:#fef3e0; }

  .slide-shell{
    aspect-ratio: 16/9;
    width:100%;
    background:var(--navy);
    color:#fff;
    border-radius:10px;
    overflow:hidden;
    position:relative;
    box-shadow: 0 20px 60px -20px rgba(15,23,42,.5);
  }
  .slide-shell.light{ background:#fff; color:var(--navy); }
  .slide-pad{ padding:4% 5%; height:100%; }
  .eyebrow{
    letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-size:.72em; font-weight:700;
  }
  .fade-in{ animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  details > summary{ cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker{ display:none; }

  input[type=range]{ accent-color:#d97706; }

  @media print{ body{ background:#fff; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,stage-3">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ============================== UTILITIES ============================== */

const sum = arr => (arr||[]).reduce((a,b)=>a+(Number(b)||0),0);
const clampArr = (arr, n, fill=0) => {
  const out = arr.slice(0,n);
  while(out.length < n) out.push(fill);
  return out;
};

function fmtINR(n, compact=false){
  n = Number(n)||0;
  if(compact){
    const abs = Math.abs(n);
    if(abs >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr';
    if(abs >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L';
    if(abs >= 1e3) return '₹' + (n/1e3).toFixed(1) + ' K';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function fmtNum(n, d=0){
  n = Number(n)||0;
  return n.toLocaleString('en-IN', {maximumFractionDigits:d, minimumFractionDigits:d});
}
function fmtPct(n, d=1){
  n = Number(n)||0;
  return (n*100).toFixed(d) + '%';
}

/* ============================== DEFAULT STATE ============================== */

function makeState(overrides={}){
  const base = {
    projectName: 'SKYLUXE',
    months: ['August','September','October'],
    duration: 3,
    avgTicketSize: 9700000,
    conversionRate: 0.09,

    bookingsPS:    [3,4,5],
    bookingsDirect:[3,2,3],
    bookingsCP:    [7,8,8],

    cplMonthly: [1200,1150,1150],

    platformPct: { meta:0.625, pmax:0.15, search:0.10, experimental:0.075, nri:0.05 },
    platformCPL: { meta:1096, pmax:1632, search:1265, experimental:1855, nri:2134 },

    socialMediaBoosting: 45000,
    droneShoot: 75000,
    ugcVideos: 50000,
    developerByteShoot: 45000,
    chatbotWhatsapp: 70000,
    societyMallActivations: 250000,
    hoardings: { count:4, months:3, rate:95000 },
    kiosks: 90000,
    newspaperLeaflet: 150000,
    cpGathering: 110000,
    cpBrokeragePercent: 0.03,
    cpVisitIncentive: 600,
    cpBookingIncentive: 25000,

    catA: [12,15,15],
    catB: [22,24,26],
    cpDigitalReach: [650,720,750],
  };
  return { ...base, ...overrides };
}

const SKYLUXE_PRESET = makeState();

function fastTrackPreset(){
  const totals = [6,6,8];
  // proportional split roughly matching skyluxe ratios (PS 28% / Direct 19% / CP 53%)
  const bookingsPS = [2,2,2];
  const bookingsDirect = [1,1,2];
  const bookingsCP = [3,3,4];
  return makeState({
    projectName: 'SKYLUXE — FAST TRACK',
    duration: 3,
    months: ['August','September','October'],
    bookingsPS, bookingsDirect, bookingsCP,
    cplMonthly: [1150,1100,1100],
    catA:[8,10,10], catB:[16,18,20], cpDigitalReach:[500,560,600],
  });
}

function blankPreset(){
  return makeState({
    projectName: 'NEW PROJECT',
    bookingsPS:[0,0,0], bookingsDirect:[0,0,0], bookingsCP:[0,0,0],
    cplMonthly:[1000,1000,1000],
    catA:[0,0,0], catB:[0,0,0], cpDigitalReach:[0,0,0],
    socialMediaBoosting:0, droneShoot:0, ugcVideos:0, developerByteShoot:0,
    chatbotWhatsapp:0, societyMallActivations:0, kiosks:0, newspaperLeaflet:0, cpGathering:0,
    hoardings:{count:0,months:3,rate:0},
  });
}

/* ============================== CALCULATION ENGINE ============================== */

function computeModel(s){
  const n = Math.max(1, Math.min(12, Number(s.duration)||1));
  const months = clampArr(s.months, n, 'Month');
  const conv = Number(s.conversionRate) > 0 ? Number(s.conversionRate) : 0.09;

  const bPS = clampArr(s.bookingsPS, n);
  const bDirect = clampArr(s.bookingsDirect, n);
  const bCP = clampArr(s.bookingsCP, n);
  const cpl = clampArr(s.cplMonthly, n, s.cplMonthly[s.cplMonthly.length-1] || 1000);

  const visitsPS = bPS.map(b => b/conv);
  const visitsDirect = bDirect.map(b => b/conv);
  const visitsCP = bCP.map(b => b/conv);
  const totalVisits = months.map((_,i)=> visitsPS[i]+visitsDirect[i]+visitsCP[i]);
  const revisits = totalVisits.map(v => v*0.22);

  const presalesSVS = visitsPS.map(v => v*2);
  const qualifiedLeads = presalesSVS.map(v => v*2);
  const totalDigitalLeads = qualifiedLeads.map(q => q/0.38);

  const digitalLGSpend = totalDigitalLeads.map((l,i)=> l*(cpl[i]||0));
  const brandingSpend = digitalLGSpend.map(v => v*0.12);
  const totalDigitalSpend = digitalLGSpend.map((v,i)=> v+brandingSpend[i]);
  const cpqlArr = digitalLGSpend.map((v,i)=> qualifiedLeads[i]>0 ? v/qualifiedLeads[i] : 0);
  const monthBookings = months.map((_,i)=> bPS[i]+bDirect[i]+bCP[i]);

  const bookingsPS_total = sum(bPS);
  const bookingsDirect_total = sum(bDirect);
  const bookingsCP_total = sum(bCP);
  const totalBookings = bookingsPS_total + bookingsDirect_total + bookingsCP_total;

  const totalVisitsSum = sum(totalVisits);
  const totalRevisitsSum = sum(revisits);
  const totalQualifiedLeads = sum(qualifiedLeads);
  const totalLeadsSum = sum(totalDigitalLeads);
  const totalDigitalLGSpendSum = sum(digitalLGSpend);
  const totalBrandingSpendSum = sum(brandingSpend);
  const totalDigitalSpendSum = totalDigitalLGSpendSum + totalBrandingSpendSum;
  const totalSVS = sum(presalesSVS);

  const objectives = {
    leadGen:     { label:'Lead Generation', leadPct:0.83,  budgetPct:0.85, leads: totalLeadsSum*0.83, budget: totalDigitalLGSpendSum*0.85 },
    branding:    { label:'Branding',        leadPct:0,     budgetPct:1.0,  leads: 0,                  budget: totalBrandingSpendSum*1.0 },
    remarketing: { label:'Remarketing',     leadPct:0.105, budgetPct:0.15, leads: totalLeadsSum*0.105, budget: totalDigitalLGSpendSum*0.15 },
    organic:     { label:'Organic',         leadPct:0.065, budgetPct:0,    leads: totalLeadsSum*0.065, budget: 0 },
  };

  const platformDefs = [
    { key:'meta', label:'Meta / Facebook', pct: s.platformPct.meta, cpl: s.platformCPL.meta },
    { key:'pmax', label:'Google Pmax + Demand Gen', pct: s.platformPct.pmax, cpl: s.platformCPL.pmax },
    { key:'search', label:'Google Search', pct: s.platformPct.search, cpl: s.platformCPL.search },
    { key:'experimental', label:'Experimental / LinkedIn / Native', pct: s.platformPct.experimental, cpl: s.platformCPL.experimental },
    { key:'nri', label:'NRI Campaigns — USA/GCC', pct: s.platformPct.nri, cpl: s.platformCPL.nri },
  ];
  const platforms = platformDefs.map(p=>{
    const budget = totalDigitalLGSpendSum * (Number(p.pct)||0);
    const leads = (Number(p.cpl)||0) > 0 ? budget/p.cpl : 0;
    return { ...p, budget, leads };
  });
  platforms.push({ key:'organic', label:'Organic (High-Intent Search)', pct:0, cpl:0, budget:0, leads: objectives.organic.leads });

  const hoardingsCost = (Number(s.hoardings.count)||0) * (Number(s.hoardings.months)||0) * (Number(s.hoardings.rate)||0);
  const cpVisitsTotal = sum(visitsCP);
  const cpIncentives = cpVisitsTotal*(Number(s.cpVisitIncentive)||0) + bookingsCP_total*(Number(s.cpBookingIncentive)||0);

  const expenses = [
    { key:'digitalLG', label:'Digital Lead Gen Spends', value: totalDigitalLGSpendSum, calc:true },
    { key:'branding', label:'Branding & Awareness', value: totalBrandingSpendSum, calc:true },
    { key:'social', label:'Social Media Boosting', value: Number(s.socialMediaBoosting)||0 },
    { key:'drone', label:'Drone & Construction Location Shoot', value: Number(s.droneShoot)||0 },
    { key:'ugc', label:'UGC Videos — 10 Videos', value: Number(s.ugcVideos)||0 },
    { key:'devbyte', label:'Developer Byte & Testimonial Shoot', value: Number(s.developerByteShoot)||0 },
    { key:'chatbot', label:'Website Chatbot + WhatsApp API Marketing', value: Number(s.chatbotWhatsapp)||0 },
    { key:'activation', label:'Society & Mall Activations', value: Number(s.societyMallActivations)||0 },
    { key:'hoardings', label:`Hoardings / OOH (${s.hoardings.count||0} × ${s.hoardings.months||0}mo × ₹${(Number(s.hoardings.rate)||0).toLocaleString('en-IN')})`, value: hoardingsCost },
    { key:'kiosks', label:'Kiosks / Wayboards', value: Number(s.kiosks)||0 },
    { key:'newspaper', label:'Newspaper Leaflet Inserts', value: Number(s.newspaperLeaflet)||0 },
    { key:'cpgather', label:'Channel Partner Gathering', value: Number(s.cpGathering)||0 },
    { key:'cpincentive', label:'Channel Partner Incentives', value: cpIncentives, calc:true },
  ];
  const totalAdvertisingBudget = sum(expenses.map(e=>e.value));
  const totalRevenue = totalBookings * (Number(s.avgTicketSize)||0);
  const advertisingCostPct = totalRevenue>0 ? totalAdvertisingBudget/totalRevenue : 0;
  const cpBrokeragePercent = Number(s.cpBrokeragePercent)||0;
  const totalMarketingCostPct = advertisingCostPct + cpBrokeragePercent;

  const catA = clampArr(s.catA, n);
  const catB = clampArr(s.catB, n);
  const cpDigitalReach = clampArr(s.cpDigitalReach, n);
  const physicalMeetings = months.map((_,i)=> ((catA[i]||0)+(catB[i]||0))*1.8);
  const outreach = physicalMeetings.map(v=>v*4);
  const catA_total = sum(catA), catB_total = sum(catB);
  const physicalMeetings_total = sum(physicalMeetings);
  const outreach_total = sum(outreach);
  const cpDigitalReach_total = sum(cpDigitalReach);

  return {
    n, months, conv,
    bPS, bDirect, bCP, cpl, monthBookings,
    visitsPS, visitsDirect, visitsCP, totalVisits, revisits,
    presalesSVS, qualifiedLeads, totalDigitalLeads, digitalLGSpend, brandingSpend, totalDigitalSpend, cpqlArr,
    bookingsPS_total, bookingsDirect_total, bookingsCP_total, totalBookings,
    totalVisitsSum, totalRevisitsSum, totalQualifiedLeads, totalLeadsSum, totalSVS,
    totalDigitalLGSpendSum, totalBrandingSpendSum, totalDigitalSpendSum,
    objectives, platforms, expenses, totalAdvertisingBudget, totalRevenue, advertisingCostPct, cpBrokeragePercent, totalMarketingCostPct,
    catA, catB, cpDigitalReach, physicalMeetings, outreach,
    catA_total, catB_total, physicalMeetings_total, outreach_total, cpDigitalReach_total,
    cpVisitsTotal, cpIncentives, hoardingsCost,
  };
}

/* ============================== ICONS ============================== */

function Icon({ name, className='w-4 h-4', strokeWidth=1.8 }){
  const common = { viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth, strokeLinecap:'round', strokeLinejoin:'round', className };
  switch(name){
    case 'target': return <svg {...common}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>;
    case 'building': return <svg {...common}><path d="M4 21V6l8-3 8 3v15"/><path d="M4 21h16"/><path d="M9 9h1M9 13h1M14 9h1M14 13h1M10 21v-4h4v4"/></svg>;
    case 'sliders': return <svg {...common}><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 12h4"/></svg>;
    case 'megaphone': return <svg {...common}><path d="M3 11v2a2 2 0 002 2h1l3 5V6l-3 5H5a2 2 0 00-2 2z"/><path d="M14 8a4 4 0 010 8"/><path d="M17 5a8 8 0 010 14"/></svg>;
    case 'download': return <svg {...common}><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>;
    case 'chevron-left': return <svg {...common}><path d="M15 18l-6-6 6-6"/></svg>;
    case 'chevron-right': return <svg {...common}><path d="M9 18l6-6-6-6"/></svg>;
    case 'maximize': return <svg {...common}><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>;
    case 'x': return <svg {...common}><path d="M18 6L6 18M6 6l12 12"/></svg>;
    case 'users': return <svg {...common}><circle cx="9" cy="8" r="3"/><path d="M2 21v-1a5 5 0 015-5h4a5 5 0 015 5v1"/><circle cx="17" cy="8" r="2.5"/><path d="M17 13.2a4.5 4.5 0 014 4.3v1.5"/></svg>;
    case 'trend': return <svg {...common}><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>;
    case 'award': return <svg {...common}><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5L7 21l5-3 5 3-1.5-8.5"/></svg>;
    case 'map-pin': return <svg {...common}><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>;
    case 'layers': return <svg {...common}><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5M3 8l9 5 9-5" opacity=".0"/><path d="M3 13l9 5 9-5"/></svg>;
    case 'wallet': return <svg {...common}><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.4"/></svg>;
    case 'check': return <svg {...common}><path d="M20 6L9 17l-5-5"/></svg>;
    case 'alert': return <svg {...common}><path d="M10.3 3.9L1.8 18a1.8 1.8 0 001.5 2.8h17.4a1.8 1.8 0 001.5-2.8L13.7 3.9a1.8 1.8 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>;
    case 'chart': return <svg {...common}><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>;
    case 'calendar': return <svg {...common}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>;
    case 'send': return <svg {...common}><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>;
    case 'compass': return <svg {...common}><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2z"/></svg>;
    case 'play': return <svg {...common}><path d="M6 4l13 8-13 8V4z"/></svg>;
    case 'plus': return <svg {...common}><path d="M12 5v14M5 12h14"/></svg>;
    case 'file': return <svg {...common}><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>;
    default: return null;
  }
}

/* ============================== SMALL UI ATOMS ============================== */

function StatBadge({ label, value, sub, icon }){
  return (
    <div className="stat-badge rounded-xl p-4 flex flex-col gap-1 shadow-sm">
      <div className="flex items-center justify-between">
        <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">{label}</span>
        {icon && <Icon name={icon} className="w-4 h-4 text-amber-600" />}
      </div>
      <div className="font-mono text-xl font-bold text-slate-900">{value}</div>
      {sub && <div className="text-xs text-slate-400">{sub}</div>}
    </div>
  );
}

function SectionCard({ title, icon, children, defaultOpen=true }){
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="card overflow-hidden mb-4">
      <button onClick={()=>setOpen(!open)} className="w-full flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-lg bg-amber-50 text-amber-700 flex items-center justify-center border border-amber-200">
            <Icon name={icon} className="w-4 h-4" />
          </div>
          <span className="font-semibold text-slate-800 text-sm tracking-wide">{title}</span>
        </div>
        <Icon name={open ? 'chevron-right' : 'chevron-right'} className={`w-4 h-4 text-slate-400 transition-transform ${open ? 'rotate-90' : ''}`} />
      </button>
      {open && <div className="px-5 pb-5 pt-1 fade-in">{children}</div>}
    </div>
  );
}

function Field({ label, children, hint }){
  return (
    <label className="block mb-3">
      <span className="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wide">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-slate-400 mt-1">{hint}</span>}
    </label>
  );
}

function NumInput({ value, onChange, prefix, suffix, step=1 }){
  return (
    <div className="flex items-center gap-1">
      {prefix && <span className="text-xs text-slate-400 font-mono">{prefix}</span>}
      <input type="number" step={step} className="num-input" value={value}
        onChange={e=>onChange(e.target.value === '' ? 0 : Number(e.target.value))} />
      {suffix && <span className="text-xs text-slate-400 font-mono">{suffix}</span>}
    </div>
  );
}

function MonthMatrix({ label, months, values, onChange }){
  return (
    <div className="mb-3">
      <span className="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">{label}</span>
      <div className="grid gap-2" style={{gridTemplateColumns:`repeat(${months.length}, minmax(0,1fr))`}}>
        {months.map((m,i)=>(
          <div key={i}>
            <div className="text-[10px] text-slate-400 mb-1 truncate">{m}</div>
            <input type="number" className="num-input" value={values[i]||0}
              onChange={e=>{
                const v = [...values]; v[i] = e.target.value===''?0:Number(e.target.value); onChange(v);
              }} />
          </div>
        ))}
      </div>
    </div>
  );

function ChartCanvas({ type, data, options, height=240 }){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!canvasRef.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), { type, data, options });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), type]);
  return <div style={{height}}><canvas ref={canvasRef}></canvas></div>;
}

function Planner({ state, setState, model }){

  const monthTotalsMatch = model.monthBookings.every((t,i)=> t === (model.bPS[i]+model.bDirect[i]+model.bCP[i]));

  const onDurationChange = (val) => {
    const n = Math.max(1, Math.min(12, Number(val)||1));
    const grow = (arr, fill) => {
      const out = arr.slice(0,n);
      while(out.length<n) out.push(fill);
      return out;
    };
    setState(prev => ({
      ...prev,
      duration: n,
      months: grow(prev.months, `Month ${prev.months.length+1}`),
      bookingsPS: grow(prev.bookingsPS, 0),
      bookingsDirect: grow(prev.bookingsDirect, 0),
      bookingsCP: grow(prev.bookingsCP, 0),
      cplMonthly: grow(prev.cplMonthly, prev.cplMonthly[prev.cplMonthly.length-1]||1000),
      catA: grow(prev.catA, 0),
      catB: grow(prev.catB, 0),
      cpDigitalReach: grow(prev.cpDigitalReach, 0),

const SLIDES = [Slide1,Slide2,Slide3,Slide4,Slide5,Slide6,Slide7,Slide8,Slide9,Slide10];
const SLIDE_NAMES = ['Cover','Way Forward','Monthly Funnel','Digital Funnel','Platform Split','Audience Matrix','OOH & Ground','CP Engine','Budget & Cost','Roadmap'];

/* ============================== DECK TAB ============================== */

function Deck({ state, model }){
  const [idx, setIdx] = useState(0);
  const wrapRef = useRef(null);
  const [isFs, setIsFs] = useState(false);

  const go = useCallback((d)=> setIdx(i => Math.min(SLIDES.length-1, Math.max(0, i+d))), []);

  useEffect(()=>{
    const onKey = (e)=>{
      if(e.key === 'ArrowRight') go(1);
      if(e.key === 'ArrowLeft') go(-1);
    };
    window.addEventListener('keydown', onKey);
    return ()=> window.removeEventListener('keydown', onKey);
  }, [go]);

  const toggleFs = () => {
    if(!document.fullscreenElement){
      wrapRef.current.requestFullscreen && wrapRef.current.requestFullscreen();
      setIsFs(true);
    } else {
      document.exitFullscreen && document.exitFullscreen();
      setIsFs(false);
    }
  };

  const SlideComp = SLIDES[idx];

  return (
    <div className="max-w-6xl">
      <div className="mb-6">
        <h2 className="font-display text-2xl font-bold text-slate-900">Presentation Deck</h2>
        <p className="text-sm text-slate-500 mt-1">Live 16:9 preview — every number below is generated from the Strategy Planner.</p>
        <div className="ruler mt-3 w-40"></div>
      </div>

      <div className="flex flex-wrap gap-2 mb-4">
        {SLIDE_NAMES.map((n,i)=>(
          <button key={i} onClick={()=>setIdx(i)}
            className={`tab-btn px-3 py-1.5 rounded-full text-[11px] font-semibold border ${i===idx ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-500 border-slate-200 hover:border-slate-400'}`}>
            {i+1}. {n}
          </button>
        ))}
      </div>

      <div ref={wrapRef} className={`relative ${isFs ? 'bg-slate-950 flex items-center justify-center p-8' : ''}`}>
        <div className={isFs ? 'w-full max-w-6xl' : ''}>
          <SlideComp state={state} model={model} />
        </div>
        <div className="absolute inset-y-0 left-0 flex items-center">
          <button onClick={()=>go(-1)} className="ml-[-14px] w-9 h-9 rounded-full bg-white shadow-lg border border-slate-200 flex items-center justify-center hover:bg-slate-50">
            <Icon name="chevron-left" className="w-4 h-4 text-slate-700" />
          </button>
        </div>
        <div className="absolute inset-y-0 right-0 flex items-center">
          <button onClick={()=>go(1)} className="mr-[-14px] w-9 h-9 rounded-full bg-white shadow-lg border border-slate-200 flex items-center justify-center hover:bg-slate-50">
            <Icon name="chevron-right" className="w-4 h-4 text-slate-700" />
          </button>
        </div>
      </div>

      <div className="flex items-center justify-between mt-4">
        <div className="flex gap-1.5">
          {SLIDES.map((_,i)=>(
            <button key={i} onClick={()=>setIdx(i)} className={`w-2 h-2 rounded-full ${i===idx?'bg-amber-600':'bg-slate-300'}`}></button>
          ))}
        </div>
        <button onClick={toggleFs} className="flex items-center gap-2 text-xs font-semibold text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50">
          <Icon name="maximize" className="w-3.5 h-3.5" /> Fullscreen
        </button>
      </div>
    </div>
  );
}

/* ============================== PPTX EXPORT ============================== */

async function generatePPTX(state, model){
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:'WIDE', width:13.33, height:7.5 });
  pptx.layout = 'WIDE';

  const NAVY='0F172A', SLATE='1E293B', GOLD='D97706', AMBER='F59E0B', WHITE='FFFFFF', LIGHT='F8FAFC', GRAY='64748B', LINE='E2E8F0';

  const headerRow = (cells) => cells.map(c => ({ text: c, options:{ bold:true, color:WHITE, fill:{color:NAVY}, fontSize:10, align: 'left' } }));
  const tblOpts = { x:0.5, w:12.33, fontSize:10.5, border:{type:'solid', color:LINE, pt:0.5}, autoPage:false, valign:'middle' };

  function addStatChips(slide, y, items){
    const w = (12.33 - (items.length-1)*0.2) / items.length;
    items.forEach((it,i)=>{
      const x = 0.5 + i*(w+0.2);
      slide.addShape('roundRect', { x, y, w, h:1.05, fill:{color:LIGHT}, line:{color:LINE, width:0.75}, rectRadius:0.06 });
      slide.addText(it[1], { x, y:y+0.08, w, h:0.55, fontSize:20, bold:true, color:GOLD, align:'center', fontFace:'Arial' });
      slide.addText(it[0], { x, y:y+0.62, w, h:0.35, fontSize:9, color:GRAY, align:'center' });
    });
  }

  function titleBlock(slide, eyebrow, title, dark=true){
    slide.addText(eyebrow.toUpperCase(), { x:0.5, y:0.35, w:10, h:0.3, fontSize:11, color:GOLD, bold:true, charSpacing:2 });
    slide.addText(title, { x:0.5, y:0.62, w:12.3, h:0.7, fontSize:26, bold:true, color: dark?WHITE:NAVY, fontFace:'Georgia' });
    slide.addShape('rect', { x:0.5, y:1.28, w:1.3, h:0.045, fill:{color:GOLD} });
  }

  /* SLIDE 1 — COVER */
  let s1 = pptx.addSlide(); s1.background = { color: NAVY };
  s1.addShape('rect', { x:0, y:7.35, w:13.33, h:0.06, fill:{color:GOLD} });
  s1.addText('MEDIA & LAUNCH STRATEGY', { x:0.8, y:2.5, w:11, h:0.4, fontSize:14, color:GOLD, bold:true, charSpacing:3 });
  s1.addText(state.projectName, { x:0.8, y:2.9, w:11.7, h:1.4, fontSize:50, bold:true, color:WHITE, fontFace:'Georgia' });
  s1.addShape('rect', { x:0.8, y:4.35, w:1.4, h:0.05, fill:{color:GOLD} });
  s1.addText(`${model.months[0]} – ${model.months[model.n-1]}  ·  ${model.n}-Month Plan`, { x:0.8, y:4.55, w:10, h:0.5, fontSize:14, color:'CBD5E1' });
  s1.addText([
    { text:`₹${(model.totalRevenue/1e7).toFixed(2)} Cr `, options:{ bold:true, color:GOLD } },
    { text:'Revenue Target   •   ', options:{ color:'CBD5E1' } },
    { text:`${model.totalBookings} `, options:{ bold:true, color:GOLD } },
    { text:'Bookings   •   ', options:{ color:'CBD5E1' } },
    { text:`${fmtNum(model.totalVisitsSum)} `, options:{ bold:true, color:GOLD } },
    { text:'Site Visits', options:{ color:'CBD5E1' } },
  ], { x:0.8, y:5.2, w:11, h:0.5, fontSize:13 });

  /* SLIDE 2 — WAY FORWARD */
  let s2 = pptx.addSlide(); s2.background = { color: WHITE };
  titleBlock(s2, 'Section 01', 'Way Forward — Strategy & Sourcing Targets', false);
  addStatChips(s2, 1.55, [
    ['Total Bookings', fmtNum(model.totalBookings)],
    ['Total Revenue', fmtINR(model.totalRevenue, true)],
    ['Duration', model.n+' Months'],
    ['Total Site Visits', fmtNum(model.totalVisitsSum)],
  ]);
  s2.addTable([
    headerRow(['Source','Bookings','Visits Required']),
    ['Presales / Digital', fmtNum(model.bookingsPS_total), fmtNum(sum(model.visitsPS))],
    ['Direct / Walk-in', fmtNum(model.bookingsDirect_total), fmtNum(sum(model.visitsDirect))],
    ['Channel Partner', fmtNum(model.bookingsCP_total), fmtNum(sum(model.visitsCP))],
  ], { ...tblOpts, y:2.9, w:6, colW:[2.6,1.7,1.7] });
  s2.addTable([
    headerRow(['Month','PS','Direct','CP','Total']),
    ...model.months.map((m,i)=>[m, String(model.bPS[i]), String(model.bDirect[i]), String(model.bCP[i]), String(model.monthBookings[i])]),
  ], { x:6.8, y:2.9, w:6.03, fontSize:10.5, border:{type:'solid', color:LINE, pt:0.5}, colW:[1.9,1.03,1.03,1.03,1.04] });

  /* SLIDE 3 — MONTHLY FUNNEL */
  let s3 = pptx.addSlide(); s3.background = { color: NAVY };
  titleBlock(s3, 'Section 02', 'Month-Wise Performance Funnel', true);
  s3.addTable([
    headerRow(['Month','Spend','Leads','CPL','Qual. Leads','SVS','Visits','Revisits','Bookings']),
    ...model.months.map((m,i)=>[
      m, fmtINR(model.totalDigitalSpend[i], true), fmtNum(model.totalDigitalLeads[i]), fmtINR(model.cpl[i]),
      fmtNum(model.qualifiedLeads[i]), fmtNum(model.presalesSVS[i]), fmtNum(model.totalVisits[i]),
      fmtNum(model.revisits[i]), String(model.monthBookings[i]),
    ]),
  ], { ...tblOpts, y:1.55, color:WHITE, fill:{color:SLATE}, border:{type:'solid', color:'334155', pt:0.5} });
  addStatChips(s3, 4.6, [
    ['Total Spend', fmtINR(sum(model.totalDigitalSpend), true)],
    ['Total Leads', fmtNum(model.totalLeadsSum)],
    ['Qualified Leads', fmtNum(model.totalQualifiedLeads)],
    ['Total Visits', fmtNum(model.totalVisitsSum)],
  ]);

  /* SLIDE 4 — DIGITAL FUNNEL & OBJECTIVE */
  let s4 = pptx.addSlide(); s4.background = { color: WHITE };
  titleBlock(s4, 'Section 03', 'Digital Funnel & Objective Breakdown', false);
  s4.addTable([
    headerRow(['Stage','Value']),
    ['Total Digital Leads', fmtNum(model.totalLeadsSum)],
    ['Qualified Leads', fmtNum(model.totalQualifiedLeads)],
    ['Site Visits (Presales)', fmtNum(sum(model.visitsPS))],
    ['Bookings (Presales)', String(model.bookingsPS_total)],
  ], { ...tblOpts, y:1.6, w:5.8, colW:[3.6,2.2] });
  s4.addTable([
    headerRow(['Objective','Leads %','Leads','Budget %','Budget']),
    ...Object.values(model.objectives).map(o=>[o.label, fmtPct(o.leadPct), fmtNum(o.leads), fmtPct(o.budgetPct), fmtINR(o.budget,true)]),
  ], { x:6.6, y:1.6, w:6.23, fontSize:10.5, border:{type:'solid', color:LINE, pt:0.5}, colW:[2.0,1.0,1.1,1.0,1.13] });

  /* SLIDE 5 — PLATFORM SPLIT */
  let s5 = pptx.addSlide(); s5.background = { color: NAVY };
  titleBlock(s5, 'Section 04', 'Platform-Wise Digital Allocation', true);
  s5.addTable([
    headerRow(['Platform','Weight','Bench. CPL','Budget','Est. Leads']),
    ...model.platforms.map(p=>[p.label, p.pct?fmtPct(p.pct):'—', p.cpl?fmtINR(p.cpl):'—', p.budget?fmtINR(p.budget,true):'₹0', fmtNum(p.leads)]),
  ], { ...tblOpts, y:1.55, color:WHITE, fill:{color:SLATE}, border:{type:'solid', color:'334155', pt:0.5}, colW:[4.3,1.5,1.8,2.2,2.53] });
  addStatChips(s5, 4.9, [
    ['Lead-Gen Budget', fmtINR(model.totalDigitalLGSpendSum, true)],
    ['Total Platform Leads', fmtNum(sum(model.platforms.map(p=>p.leads)))],
  ]);

  /* SLIDE 6 — AUDIENCE MATRIX */
  let s6 = pptx.addSlide(); s6.background = { color: WHITE };
  titleBlock(s6, 'Section 05', 'Target Audience & Communication Matrix', false);
  const personas = [
    ['Primary','HNI End-Users, 35–55','City core & premium suburbs','Skyline views, concierge living, low density','Cinematic walkthroughs, amenity films'],
    ['Secondary','NRI Investors','USA · GCC · UK · Singapore','Rental yield, developer trust, remote booking','Testimonial reels, virtual site tours'],
    ['Tertiary','Upgrade Buyers','Existing catchment, 15km radius','Larger layouts, upgrade offers','Comparison carousels, EMI calculators'],
  ];
  personas.forEach((p,i)=>{
    const x = 0.5 + i*4.14;
    s6.addShape('roundRect', { x, y:1.6, w:3.94, h:4.6, fill:{color:LIGHT}, line:{color:LINE, width:0.75}, rectRadius:0.06 });
    s6.addText(p[0].toUpperCase(), { x:x+0.25, y:1.85, w:3.4, h:0.3, fontSize:10, color:GOLD, bold:true, charSpacing:2 });
    s6.addText(p[1], { x:x+0.25, y:2.15, w:3.5, h:0.6, fontSize:16, bold:true, color:NAVY, fontFace:'Georgia' });
    s6.addText([
      {text:'Geography\n', options:{bold:true, color:NAVY, fontSize:10}},
      {text:p[2]+'\n\n', options:{color:GRAY, fontSize:10}},
      {text:'Key USPs\n', options:{bold:true, color:NAVY, fontSize:10}},
      {text:p[3]+'\n\n', options:{color:GRAY, fontSize:10}},
      {text:'Content Focus\n', options:{bold:true, color:NAVY, fontSize:10}},
      {text:p[4], options:{color:GRAY, fontSize:10}},
    ], { x:x+0.25, y:2.9, w:3.5, h:3.1 });
  });

  /* SLIDE 7 — OOH & GROUND */
  let s7 = pptx.addSlide(); s7.background = { color: NAVY };
  titleBlock(s7, 'Section 06', 'OOH, Content & Ground Activation Plan', true);
  const oohItems = model.expenses.filter(e=>['social','drone','ugc','devbyte','chatbot','activation','hoardings','kiosks','newspaper'].includes(e.key));
  s7.addTable([
    headerRow(['Line Item','Investment']),
    ...oohItems.map(e=>[e.label, fmtINR(e.value)]),
  ], { ...tblOpts, y:1.55, w:8, color:WHITE, fill:{color:SLATE}, border:{type:'solid', color:'334155', pt:0.5}, colW:[6,2] });
  addStatChips(s7, 5.9, [ ['Total Offline & Production', fmtINR(sum(oohItems.map(e=>e.value)), true)] ]);

  /* SLIDE 8 — CP ENGINE */
  let s8 = pptx.addSlide(); s8.background = { color: WHITE };
  titleBlock(s8, 'Section 07', 'Channel Partner Activation Engine', false);
  s8.addTable([
    headerRow(['Month','CAT A','CAT B','Meetings','Outreach','CP Digital']),
    ...model.months.map((m,i)=>[m, String(model.catA[i]), String(model.catB[i]), fmtNum(model.physicalMeetings[i]), fmtNum(model.outreach[i]), String(model.cpDigitalReach[i])]),
  ], { ...tblOpts, y:1.6, w:6, colW:[1.4,0.9,0.9,1.1,1.1,0.6] });
  s8.addTable([
    headerRow(['Month','CP Visits','CP Bookings']),

  addStatChips(s8, 4.6, [
    ['Total CP Meetings', fmtNum(model.physicalMeetings_total)],
    ['Total CP Bookings', String(model.bookingsCP_total)],
  ]);

  /* SLIDE 9 — BUDGET */
  let s9 = pptx.addSlide(); s9.background = { color: NAVY };
  titleBlock(s9, 'Section 08', '90-Day Budget Bifurcation & Cost Metrics', true);
  s9.addTable([
    headerRow(['Line Item','Investment']),
    ...model.expenses.map(e=>[e.label, fmtINR(e.value)]),
  ], { ...tblOpts, y:1.55, w:8.2, color:WHITE, fill:{color:SLATE}, border:{type:'solid', color:'334155', pt:0.5}, colW:[6.2,2] });
  const chipsX = 9;
  [['Total Advertising Budget', fmtINR(model.totalAdvertisingBudget, true)],
   ['Total Revenue Target', fmtINR(model.totalRevenue, true)],
   ['Advertising Cost %', fmtPct(model.advertisingCostPct)],
   ['Total Marketing Cost %', fmtPct(model.totalMarketingCostPct)]].forEach((it,i)=>{
     const y = 1.55 + i*1.15;
     s9.addShape('roundRect', { x:chipsX, y, w:3.83, h:0.95, fill:{color:'1E293B'}, line:{color:GOLD, width:0.75}, rectRadius:0.06 });
     s9.addText(it[1], { x:chipsX, y:y+0.08, w:3.83, h:0.5, fontSize:17, bold:true, color:GOLD, align:'center' });
     s9.addText(it[0], { x:chipsX, y:y+0.56, w:3.83, h:0.3, fontSize:9, color:'CBD5E1', align:'center' });
  });

  /* SLIDE 10 — ROADMAP */
  let s10 = pptx.addSlide(); s10.background = { color: NAVY };
  titleBlock(s10, 'Section 09', 'Conclusion & Action Roadmap', true);
  const steps = [
    ['Week 1–2','Creative production, hoarding installation & CRM / chatbot setup'],

  addStatChips(s10, 4.4, [
    ['Target Bookings', String(model.totalBookings)],
    ['Revenue Goal', fmtINR(model.totalRevenue, true)],
    ['Marketing Cost %', fmtPct(model.totalMarketingCostPct)],

  await pptx.writeFile({ fileName: `${state.projectName.replace(/\s+/g,'_')}_Media_Plan.pptx` });
}

            <span className="font-display font-bold text-lg tracking-wide">{state.projectName}</span>
          </div>
          <div className="text-[10px] uppercase tracking-[0.2em] text-amber-500 mt-1 font-semibold">Media Plan Studio</div>
        </div>
        <nav className="flex-1 px-3 py-5 space-y-1">
          {TABS.map(t=>(
            <button key={t.key} onClick={()=>setTab(t.key)}
              className={`tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${tab===t.key ? 'bg-amber-600 text-white' : 'text-slate-300 hover:bg-white/5'}`}>
              <Icon name={t.icon} className="w-4 h-4" />
              {t.label}
            </button>
          ))}
        </nav>
        <div className="px-6 py-5 border-t border-white/10 text-[11px] text-slate-400 space-y-1">
          <div className="flex justify-between"><span>Bookings</span><span className="font-mono text-amber-400">{model.totalBookings}</span></div>
          <div className="flex justify-between"><span>Revenue</span><span className="font-mono text-amber-400">{fmtINR(model.totalRevenue, true)}</span></div>
          <div className="flex justify-between"><span>Duration</span><span className="font-mono text-amber-400">{model.n} mo</span></div>
        </div>
        <div className="ruler-vert absolute" style={{left:0, top:0, bottom:0}}></div>
      </aside>

      <main className="flex-1 overflow-y-auto p-8 lg:p-10">
        {tab==='planner' && <Planner state={state} setState={setState} model={model} />}
        {tab==='deck' && <Deck state={state} model={model} />}
        {tab==='export' && <ExportTab state={state} model={model} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
